spring:
  application:
    name: clearing-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clearing?reWriteBatchedInserts=true}
    username: ${DB_USER:clearing}
    password: ${DB_PASSWORD:clearing}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:32}
      minimum-idle: 4
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  tomcat:
    max-connections: 2000
    accept-count: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        clearing.payment.processing: true

clearing:
  settlement-currency: USD
  quote-ttl: ${QUOTE_TTL:30s}
  max-transactions-per-message: 500
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    cycle-interval: ${CYCLE_INTERVAL:60s}
    lsm-interval: ${LSM_INTERVAL:500ms}
    outbox-interval: 200ms
    outbox-batch-size: 1000
  engine:
    base-url: ${ENGINE_URL:http://localhost:7070}
    read-timeout: 60s
    max-attempts: 3

logging:
  level:
    io.github.eunini.clearing: INFO
