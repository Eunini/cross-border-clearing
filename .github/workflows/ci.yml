name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust engine (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netting-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: netting-engine
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Benchmarks compile
        run: cargo bench --no-run

  java:
    name: Java (mvn verify incl. Testcontainers and engine contract tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: netting-engine
      - name: Start netting engine for contract tests
        working-directory: netting-engine
        run: |
          cargo build --release --bin netting-engine
          BIND_ADDR=127.0.0.1:7070 ./target/release/netting-engine &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7070/health && break; sleep 1; done
      - name: Maven verify
        env:
          ENGINE_URL: http://127.0.0.1:7070
        run: ./mvnw -B -T 2 verify
