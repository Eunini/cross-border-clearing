[package]
name = "netting-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Multilateral netting and liquidity-saving (gridlock resolution) engine for a simulated cross-border clearing network"
license = "MIT"
publish = false

[lib]
name = "netting_engine"
path = "src/lib.rs"

[[bin]]
name = "netting-engine"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bench]]
name = "netting"
harness = false

[profile.release]
lto = "thin"
codegen-units = 4

[profile.bench]
lto = "thin"
codegen-units = 4
